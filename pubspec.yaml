name: finansme_flutter
publish_to: 'none'
description: Interface base do app FinansMe em Flutter.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_icons:
  android: true
  ios: true

  windows:
    generate: true

  image_path: "assets/images/logo.png"
